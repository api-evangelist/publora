name: Publora
description: >-
  Publora is a social media scheduling and publishing platform with a REST API
  and a native remote MCP server. One integration publishes and schedules posts
  across LinkedIn, X (Twitter), Instagram, Threads, TikTok, YouTube, Facebook,
  Bluesky, Mastodon, and Telegram, with pre-signed media uploads, per-platform
  settings, HMAC-signed webhooks for post-lifecycle events, LinkedIn analytics
  and engagement actions, and a workspace/B2B layer for managed users. It uses
  long-lived API-key authentication, idempotent create/update operations, and
  exposes 18 MCP tools callable directly by AI agents (keyless tools/list).
